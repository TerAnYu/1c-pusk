services:
  1cpusk:
    image: ghcr.io/teranyu/1c-pusk:latest
    container_name: 1cpusk
    hostname: "1cpusk"
    restart: always
    logging:
      driver: local
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "--retry", "0", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - ./data:/var/opt/1C/pusk/data:rw
      - ./log:/var/opt/1C/pusk/log:rw
    ports:
      - "8080:8080/tcp"
