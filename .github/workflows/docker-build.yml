name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      pusk_version:
        description: 'Version of ite-pusk (e.g., 1.3.1)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.pusk_version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=$(date +%d.%m.%Y)" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Download distribution archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Download ite-pusk tarball from official site
          echo "Downloading ite-pusk-${VERSION}.tar.gz..."
          curl -L -o "ite-pusk-${VERSION}.tar.gz" "https://it-expertise.ru/pusk/ite-pusk-${VERSION}.tar.gz" || {
            echo "Error: Failed to download ite-pusk-${VERSION}.tar.gz"
            echo "Check https://it-expertise.ru/pusk/#download for available versions"
            exit 1
          }
          
          # Download java-api from 1C ITS
          echo "Downloading java-api-8.3.11.zip..."
          curl -L -o "java-api-8.3.11.zip" "https://its.1c.ru/db/files/1CITS/EXE/java-api-8.3.11/java-api-8.3.11.zip" || {
            echo "Error: Failed to download java-api-8.3.11.zip"
            exit 1
          }
          
          ls -la *.tar.gz *.zip

      - name: Prepare build environment
        run: |
          # Extract pusk distribution
          mkdir -p pusk
          tar -zxf ite-pusk-*.tar.gz --strip-components=1 -C pusk
          
          # Extract 1C Java API libraries (nested zip structure)
          echo "Extracting 1C Java API libraries..."
          TEMP_DIR=$(mktemp -d)
          unzip -q java-api-*.zip -d "$TEMP_DIR"
          
          # Handle nested zip structure
          if [ -f "$TEMP_DIR"/java-api-*/java-api-*.zip ]; then
            unzip -q "$TEMP_DIR"/java-api-*/java-api-*.zip -d "$TEMP_DIR"
          fi
          if [ -f "$TEMP_DIR"/java-api-*/com._1c.v8.ibis.admin-*.zip ]; then
            unzip -q "$TEMP_DIR"/java-api-*/com._1c.v8.ibis.admin-*.zip -d "$TEMP_DIR"
          fi
          
          # Copy libraries
          mkdir -p pusk/lib
          cp "$TEMP_DIR"/com._1c.v8.ibis.admin-*/lib/*.jar pusk/lib/ 2>/dev/null || {
            # Try alternative structure
            find "$TEMP_DIR" -name "*.jar" -exec cp {} pusk/lib/ \;
          }
          rm -rf "$TEMP_DIR"
          
          echo "Libraries copied:"
          ls -la pusk/lib/
          
          # Create install directory and package
          mkdir -p build/install
          tar -zcf build/install/pusk.tgz -C pusk .

      - name: Update build configuration
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE="${{ steps.version.outputs.date }}"
          FULL_VERSION="${VERSION}-${DATE}"
          
          # Update .arg file
          sed -i "s/^OC_PUSK_VERSION=.*/OC_PUSK_VERSION=\"${FULL_VERSION}\"/" build/.arg
          
          echo "Updated version to: ${FULL_VERSION}"
          cat build/.arg

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./build
          build-contexts: |
            install=./build/install
          push: true
          build-args: |
            OS_TAG=debian:bookworm-slim
            OC_PUSK_TYPE=pusk
            OC_PUSK_VERSION=${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
